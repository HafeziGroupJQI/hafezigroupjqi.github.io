name: build and deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *" # daily safety net in case a dispatch is missed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout the vault (public content)
        uses: actions/checkout@v4
        with:
          repository: HafeziGroupJQI/vault
          path: vault-src
          # the default token can read the vault only while it is public; a fine-grained
          # PAT with contents:read on the vault (secret VAULT_READ_TOKEN) covers a private vault
          token: ${{ secrets.VAULT_READ_TOKEN || github.token }}
      - run: rm -f content && ln -s vault-src/content content
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vault-src/requirements.txt
      - run: pip install -r vault-src/requirements.txt
      - name: build site
        run: npm run build
        env:
          INTERNAL_SITE_URL: ${{ vars.INTERNAL_SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
