name: public site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *" # daily safety net in case a dispatch is missed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: checkout the vault (public content)
        uses: actions/checkout@v5
        with:
          repository: HafeziGroupJQI/vault
          # The whole history: the "Recently modified" page reads it (tools/recent-changes.mjs).
          fetch-depth: 0
          path: vault-src
          # the default token can read the vault only while it is public; a fine-grained
          # PAT with contents:read on the vault (secret VAULT_READ_TOKEN) covers a private vault
          token: ${{ secrets.VAULT_READ_TOKEN || github.token }}
      - run: rm -f content && ln -s vault-src/content content
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install the headless browser that renders Excalidraw drawings
        run: npm run setup:browser -- --with-deps
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vault-src/requirements.txt
      - run: pip install -r vault-src/requirements.txt
      - name: build site
        run: npm run build
        env:
          # the members API the site signs in with (service worker + /auth pages)
          MEMBERS_API_ORIGIN: ${{ vars.MEMBERS_API_ORIGIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # the member site (private repo members-site, Cloudflare Worker) shares this layout, so a
  # website change rebuilds it too; vault changes reach it through the vault's own dispatch
  dispatch-members:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.MEMBERS_DISPATCH_TOKEN }}
          repository: HafeziGroupJQI/members-site
          event-type: website-updated
          client-payload: '{"sha": "${{ github.sha }}"}'
