name: preview build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: HafeziGroupJQI/vault
          # The whole history: each page's History reads it (tools/history.mjs).
          fetch-depth: 0
          path: vault-src
          # the default token can read the vault only while it is public; a fine-grained
          # PAT with contents:read on the vault (secret VAULT_READ_TOKEN) covers a private vault
          token: ${{ secrets.VAULT_READ_TOKEN || github.token }}
      - run: rm -f content && ln -s vault-src/content content
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install the headless browser that renders Excalidraw drawings
        run: npm run setup:browser -- --with-deps
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r vault-src/requirements.txt
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: site-preview
          path: public
