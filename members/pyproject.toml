[project]
name = "hafezi-members"
version = "0.1.0"
description = "Authenticated gateway for the Hafezi Group private website"
requires-python = ">=3.12"
dependencies = [
  "authlib>=1.3",
  "fastapi>=0.115",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "pydantic-settings>=2.4",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hafezi-members = "hafezi_members.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hafezi_members"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
